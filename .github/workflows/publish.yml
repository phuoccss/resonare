name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: ${{ github.repository_owner == 'phuoccss' }}
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          install: false

      # Ensure npm 11.5.1 or later for trusted publishing
      - name: Install latest npm
        shell: bash
        run: pnpm add -g npm@11

      - name: Install dependencies
        shell: bash
        run: pnpm i --frozen-lockfile --ignore-scripts

      - uses: infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          domain: https://app.infisical.com
          project-slug: resonare
          env-slug: prod
          identity-id: e783897d-2572-434c-bc59-d673fae68eda

      - name: Build & deploy
        run: |
          pnpm turbo deploy

      - name: Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          version-script: pnpm changeset version && pnpm i --lockfile-only
          publish-script: pnpm changeset publish

      - name: Publish dev version
        if: steps.changesets.outputs.published != 'true'
        run: |
          git checkout main
          pnpm changeset version --snapshot dev
          pnpm changeset publish --tag dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
